services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: gofermart
      POSTGRES_USER: gofermart
      POSTGRES_PASSWORD: password
    ports:
      - "127.0.0.1:5434:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U gofermart -d gofermart"]
      interval: 2s
      timeout: 3s
      retries: 15

volumes:
  postgres_data:
